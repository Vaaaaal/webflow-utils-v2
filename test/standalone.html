<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>webflow-utils v2 — test standalone (usage v1)</title>
  <style>[wu-animate] { opacity: 0; } body { font-family: system-ui, sans-serif; margin: 2rem; }</style>
</head>
<body>
  <h1>Standalone : un script classique par module, comme en v1</h1>
  <a id="anchor" href="/services" wu-anchor="tarifs">Tarifs</a>
  <div id="anim" wu-animate="v1-style">preset ajouté à la mode v1 (script synchrone juste après)</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
  <script src="/dist/standalone/links/anchor.js"></script>
  <script src="/dist/standalone/animation/animate.js"></script>
  <script>
    // Pattern v1 : doit continuer de marcher avec les scripts standalone.
    WU.animate.presets['v1-style'] = function () { return { from: { x: -50 }, to: { x: 0 } }; };
  </script>
</body>
</html>
