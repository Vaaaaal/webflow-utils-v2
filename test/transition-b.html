<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>transition b</title>
<style>
  [wu-transition="overlay"] { position: fixed; inset: 0; visibility: hidden; pointer-events: none; }
  html.wu-transition-pending [wu-transition="overlay"] { visibility: visible; pointer-events: auto; }
</style>
<script>
  (function () {
    var d = document.documentElement, s = document.currentScript, k = 'wu-transition', t = 0;
    window.WU = window.WU || {};
    WU._transitionHead = true;
    try { t = +sessionStorage.getItem(k) || 0; sessionStorage.removeItem(k); } catch (e) {}
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var arrival = Date.now() - t < 10000;
    var first = s && s.hasAttribute('wu-transition-first-load') && s.getAttribute('wu-transition-first-load') !== 'false';
    if (arrival) { d.classList.add('wu-transition-arrival'); WU._transitionArrival = true; }
    // Retient les apparitions wu-animate (animate.js) jusqu'au retrait de l'overlay
    WU._transitionRelease = function () {
      if (WU._transitionReleased) return;
      WU._transitionReleased = true;
      var h = document.querySelectorAll('[wu-animate-applied="wu-transition"]');
      for (var i = 0; i < h.length; i++) h[i].removeAttribute('wu-animate-applied');
      if (h.length && WU.animate && WU.animate.init) WU.animate.init();
    };
    if ((arrival || first) && !(s && s.getAttribute('wu-transition-hold-animate') === 'false')) {
      document.addEventListener('DOMContentLoaded', function () {
        if (WU._transitionReleased) return;
        var a = document.querySelectorAll('[wu-animate]:not(script), [wu-animate-group]');
        for (var i = 0; i < a.length; i++) if (!a[i].hasAttribute('wu-animate-applied')) a[i].setAttribute('wu-animate-applied', 'wu-transition');
      }, { once: true });
    }
    if (arrival || first) {
      d.classList.add('wu-transition-pending');
      WU._transitionFallback = setTimeout(function () { d.classList.remove('wu-transition-pending'); WU._transitionRelease(); }, 4000);
    }
  })();
</script>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  [wu-animate] { opacity: 0; }
  [wu-transition="overlay"] { background: #111; z-index: 99; }
</style>
</head>
<body>
  <div wu-transition="overlay" wu-transition-preset="slide-up" wu-transition-duration="0.6"></div>
  <main wu-transition="page">
    <h1 wu-animate="fade-up">Page b</h1>
    <p><a id="go" href="/test/transition-a.html">Aller à la page a</a></p>
  </main>
  <script async type="module" src="/dist/wu.js" wu-transition wu-animate></script>
</body>
</html>
